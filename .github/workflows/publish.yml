name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      # A tag names a version to everyone who reads it. PyPI refuses to replace
      # a release, so a tag that disagrees with the package would either publish
      # the wrong number or fail at the upload, after the build had passed.
      - name: The tag has to name the packaged version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c 'import capecli; print(capecli.__version__)')"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG does not name version $VERSION" >&2
            exit 1
          fi
          echo "$TAG names version $VERSION"

      # A tag can point at any commit, including one that never went through CI.
      - name: Tests
        run: pytest

      - name: Build sdist and wheel
        run: python -m build

      # Catches a README that PyPI would refuse to render, before an upload that
      # cannot be taken back.
      - name: Check the distributions
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's own identity, so there
      # is no API token to store or rotate.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history so the annotated tag's own message is readable below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # The release notes are the tag's message. They are written once, when
      # the tag is made, and live in git rather than in a workflow -- so
      # `git show v0.1.0` and the GitHub release say the same thing. A
      # lightweight tag carries no message, and falls back to generated notes.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          if [ -n "$NOTES" ]; then
            gh release create "$TAG" dist/* \
              --repo "$REPO" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/* \
              --repo "$REPO" --title "$TAG" --generate-notes
          fi
