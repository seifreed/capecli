[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capecli"
# Read from capecli/__init__.py, which the CLI already prints for --version.
# One place to bump, and the tag guard in the publish workflow reads the same
# one, so a tag cannot name a version the package does not carry.
dynamic = ["version"]
description = "CLI and library for the CAPE v2 sandbox REST API"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Marc Rivero" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cape", "capev2", "sandbox", "malware", "dfir", "rest-api", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.28", "prettytable>=3.18"]

[project.urls]
Homepage = "https://github.com/seifreed/capecli"
Repository = "https://github.com/seifreed/capecli"
Issues = "https://github.com/seifreed/capecli/issues"

[dependency-groups]
dev = [
    "black>=25.1",
    "ruff>=0.12",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "bandit>=1.8",
    "pip-audit>=2.9",
    "build>=1.2",
    "twine>=6.1",
]

[project.scripts]
capecli = "capecli.cli:main"

[tool.hatch.version]
path = "capecli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["capecli"]

# The sdist is the thing someone rebuilds from, so it carries the tests and the
# CI that prove the build, and nothing that only matters on this machine.
[tool.hatch.build.targets.sdist]
include = [
    "capecli",
    "tests",
    ".github",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.black]
target-version = ["py314"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
strict = true
files = ["capecli", "tests"]
# docker/ is a local, untracked CAPE cluster we point capecli at. Its machinery
# module subclasses a base that only exists inside the CAPE tree, so it can only
# be checked there.
exclude = ["^venv/", "^docker/"]

[tool.bandit]
# venv is other people's code. docker/ is that same local test rig: its scripts
# spawn processes on purpose -- one runs capecli, the other runs CAPE's own
# utils/process.py -- so B404/B603 describe what they are for, and silencing
# those in place would need suppressions the package does not carry.
exclude_dirs = ["venv", ".venv", "docker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=capecli --cov-branch --cov-report=term-missing --cov-fail-under=100"
# Warnings are defects here too: a leaked socket and a pending deprecation both
# arrive this way, and neither shows up as a failing assertion.
filterwarnings = ["error"]
